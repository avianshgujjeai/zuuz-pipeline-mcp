
name: Publish to MCP Registry

# Runs entirely on GitHub's servers, triggered by pushing a version tag
# (via a Release in the GitHub UI — no local git needed). Lives in its
# own repo; nothing here touches the ZUUZ-Revamp site or its Vercel
# project. The only link to the live site is the domain-ownership file
# at zuuz.ai/.well-known/mcp-registry-auth, which is what earns the
# branded `ai.zuuz/*` namespace instead of a generic GitHub-username one.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test --if-present

      - name: Set package version to match the tag
        run: npm version ${GITHUB_REF#refs/tags/v} --no-git-tag-version --allow-same-version

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry via zuuz.ai domain (DNS auth)
        run: ./mcp-publisher login dns --domain zuuz.ai --private-key ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Set version in server.json to match the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
